    <!-- React & ReactDOM -->

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {

                            200: '#bae6fd',

    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Ubuntu', sans-serif;
        }
        
        body {
            background: #000000;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid #0ea5e9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Skin tone slider */
        .skin-tone-slider::-webkit-slider-thumb {
            background: var(--thumb-color, #ffffff);
            border: 2px solid #18181b;
        }
        .skin-tone-slider::-moz-range-thumb {
            background: var(--thumb-color, #ffffff);
            border: 2px solid #18181b;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
</head>
<body class="dark bg-black text-white">

    <script type="text/babel">

        const { useState, useEffect, useRef } = React;

        // HeroUI-inspired Components
        const Card = ({ children, className = '', ...props }) => (
            <div className={`bg-zinc-900 border border-zinc-800 rounded-2xl p-6 ${className}`} {...props}>
                {children}
            </div>
        );

        const Button = ({ children, variant = 'solid', color = 'primary', isLoading = false, className = '', ...props }) => {
            const baseClasses = 'px-6 py-3 rounded-xl font-semibold transition-all duration-200 flex items-center justify-center gap-2';
            const variants = {
                solid: color === 'primary' 
                    ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-500/20' 
                    : color === 'success'
                    ? 'bg-green-600 hover:bg-green-700 text-white shadow-lg shadow-green-500/20'
                    : color === 'danger'
                    ? 'bg-red-600 hover:bg-red-700 text-white shadow-lg shadow-red-500/20'
                    : 'bg-zinc-800 hover:bg-zinc-700 text-white',
                bordered: `border-2 ${color === 'primary' ? 'border-blue-600 text-blue-600 hover:bg-blue-600/10' : 'border-zinc-700 text-white hover:bg-zinc-800'}`,
                light: `${color === 'primary' ? 'bg-blue-600/10 text-blue-600 hover:bg-blue-600/20' : 'bg-zinc-800/50 text-white hover:bg-zinc-800'}`,
            };
            
            return (
                <button className={`${baseClasses} ${variants[variant]} ${className}`} disabled={isLoading} {...props}>
                    {isLoading ? <div className="spinner" /> : children}
                </button>
            );
        };

        const Input = ({ label, helperText, ...props }) => (
            <div className="w-full">
                {label && <label className="block text-sm font-medium text-zinc-400 mb-2">{label}</label>}

                    {...props} 
                />
                {helperText && <p className="text-xs text-zinc-500 mt-1">{helperText}</p>}
            </div>
        );

        const Select = ({ label, children, ...props }) => (
            <div className="w-full">
                {label && <label className="block text-sm font-medium text-zinc-400 mb-2">{label}</label>}

                    {...props}
                >
                    {children}
                </select>
            </div>
        );

        const Checkbox = ({ label, children, ...props }) => (
            <label className="flex items-center gap-3 cursor-pointer group">
                <input 
                    type="checkbox" 
                    className="w-5 h-5 rounded-lg border-2 border-zinc-700 bg-zinc-900 checked:bg-blue-600 checked:border-blue-600 transition-all cursor-pointer appearance-none relative
                    before:content-['✓'] before:absolute before:inset-0 before:flex before:items-center before:justify-center before:text-white before:text-sm before:opacity-0 checked:before:opacity-100"
                    {...props} 
                />
                <span className="text-sm text-zinc-300 group-hover:text-white transition-colors">{label || children}</span>
            </label>
        );

        const Tabs = ({ tabs, activeTab, onChange }) => (
            <div className="flex gap-2 p-1 bg-zinc-900 rounded-xl overflow-x-auto">
                {tabs.map(tab => (
                    <button
                        key={tab.key}
                        onClick={() => onChange(tab.key)}
                        className={`px-4 py-2.5 rounded-lg font-semibold text-sm whitespace-nowrap transition-all ${
                            activeTab === tab.key 
                                ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' 
                                : 'text-zinc-400 hover:text-white hover:bg-zinc-800'
                        }`}
                    >
                        {tab.label}
                    </button>
                ))}
            </div>
        );

        const Chip = ({ children, color = 'default', className = '' }) => {
            const colors = {
                default: 'bg-zinc-800 text-zinc-300',
                primary: 'bg-blue-600/20 text-blue-400 border border-blue-600/30',
                success: 'bg-green-600/20 text-green-400 border border-green-600/30',
                warning: 'bg-yellow-600/20 text-yellow-400 border border-yellow-600/30',
                danger: 'bg-red-600/20 text-red-400 border border-red-600/30'
            };
            
            return (
                <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold ${colors[color]} ${className}`}>
                    {children}
                </span>
            );
        };

        const Slider = ({ label, value, onChange, min = 0, max = 100, ...props }) => (
            <div className="w-full">
                {label && (
                    <div className="flex justify-between mb-2">
                        <label className="text-sm font-medium text-zinc-400">{label}</label>
                        <span className="text-sm font-semibold text-blue-500">{value}</span>
                    </div>
                )}
                <input
                    type="range"
                    min={min}
                    max={max}
                    value={value}
                    onChange={onChange}
                    className="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer
                    [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-5 [&::-webkit-slider-thumb]:h-5 
                    [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-blue-600 [&::-webkit-slider-thumb]:cursor-pointer
                    [&::-webkit-slider-thumb]:shadow-lg [&::-webkit-slider-thumb]:shadow-blue-500/30
                    [&::-webkit-slider-thumb]:hover:scale-110 [&::-webkit-slider-thumb]:transition-transform"
                    {...props}
                />
            </div>
        );

        // --- ICONS (Font Awesome) ---
        const Icon = ({ name, className = '', size }) => (
            <i className={`fa-solid fa-${name} ${className}`} style={size ? { fontSize: `${size}px` } : {}}></i>
        );

        // --- CLUB ID LOOKUP COMPONENT ---
        const IdLookupField = ({ label, value, onChange, placeholder, name, clubNameField }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [showDropdown, setShowDropdown] = useState(false);
            const [isSearching, setIsSearching] = useState(false);
            const dropdownRef = useRef(null);
            const inputRef = useRef(null);

            // Close dropdown when clicking outside
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target) && 
                        inputRef.current && !inputRef.current.contains(event.target)) {
                        setShowDropdown(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            // Debounced search
            useEffect(() => {
                const delayTimer = setTimeout(() => {
                    if (searchTerm.trim().length >= 2 && isNaN(searchTerm)) {
                        // Only search if it's not a pure number
                        searchClubs();
                    } else {
                        setSearchResults([]);
                        setShowDropdown(false);
                    }
                }, 300);

                return () => clearTimeout(delayTimer);
            }, [searchTerm]);

            const searchClubs = async () => {
                if (!searchTerm.trim()) return;
                // Limit search term length to prevent DoS
                if (searchTerm.length > 100) return;
                setLoading(true);
                
                try {
                    const response = await fetch(
                        `${PROXY_URL}/api/clubs?search=${encodeURIComponent(searchTerm)}&limit=50`
                    );
                    
                    if (!response.ok) throw new Error('Failed to search database');
                    
                    const data = await response.json();
                    // Already sorted by database, but just in case
                    const sortedData = data.sort((a, b) => (b.Rep || 0) - (a.Rep || 0));
                    setSearchResults(sortedData);
                    setShowDropdown(sortedData.length > 0);
                } catch (err) {
                    console.error('Search error:', err);
                } finally {
                    setLoading(false);
                }
            };

            const selectClub = (club) => {
                // Set the club ID
                const syntheticEvent = {
                    target: { name, value: club['Unique ID'] }
                };
                onChange(syntheticEvent);
                
                // If clubNameField is provided, also set the club name
                if (clubNameField) {
                    const nameEvent = {
                        target: { name: clubNameField, value: club.Name }
                    };
                    onChange(nameEvent);
                }
                
                setSearchTerm('');
                setSearchResults([]);
                setShowDropdown(false);
                setIsSearching(false);
            };

            const handleInputChange = (e) => {
                const val = e.target.value;
                
                // If it's a number, treat it as direct ID input
                if (!isNaN(val) && val.trim() !== '') {
                    onChange(e);
                    setSearchTerm('');
                    setShowDropdown(false);
                    setIsSearching(false);
                } else {
                    // It's text, treat as search
                    setSearchTerm(val);
                    setIsSearching(true);
                    if (!val) {
                        onChange({ target: { name, value: '' } });
                    }
                }
            };

            const handleFocus = () => {
                if (searchTerm) {
                    setShowDropdown(true);
                }
            };

            const displayValue = isSearching ? searchTerm : value;

            return (
                <div className="w-full">
                    {label && <label className="text-xs text-slate-400 block mb-1">{label}</label>}
                    
                    <div className="relative">
                        <input
                            ref={inputRef}
                            type="text"
                            name={name}
                            value={displayValue}
                            onChange={handleInputChange}
                            onFocus={handleFocus}
                            placeholder={placeholder}
                            className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white"
                        />
                        {loading && (
                            <div className="absolute right-3 top-1/2 -translate-y-1/2">
                                <div className="spinner"></div>
                            </div>
                        )}

                        {/* Dropdown Results */}
                        {showDropdown && searchResults.length > 0 && (
                            <div 
                                ref={dropdownRef}
                                className="absolute z-50 left-0 mt-2 bg-slate-900 border-2 border-slate-500 rounded shadow-2xl max-h-96 overflow-y-auto min-w-[600px] w-[600px]"
                            >
                                {searchResults.map((club) => {
                                    const duplicates = searchResults.filter(c => c.Name === club.Name && c.Nation === club.Nation);
                                    const isFemale = duplicates.length > 1 && Number(club['Unique ID']) === Math.max(...duplicates.map(d => Number(d['Unique ID'])));
                                    
                                    return (
                                    <button
                                        key={club['Unique ID']}
                                        onClick={() => selectClub(club)}
                                        className="w-full bg-slate-900 hover:bg-slate-700 border-b border-slate-700 last:border-b-0 p-4 text-left transition-colors"
                                    >
                                        <div className="flex items-start justify-between gap-4">
                                            <div className="flex-1 min-w-0">
                                                <div className="font-bold text-white truncate flex items-center gap-2">
                                                    {club.Name}
                                                    {isFemale && <span className="text-pink-500 text-xs font-bold">F</span>}
                                                </div>
                                                <div className="text-xs text-zinc-500 mt-1 flex items-center gap-2 flex-wrap">
                                                    <span>{club.Nation}</span>
                                                    <span>•</span>
                                                    <span>Rep: {club.Rep}</span>
                                                    {club.Status && (
                                                        <>
                                                            <span>•</span>
                                                            <Chip 
                                                                color={
                                                                    club.Status === 'Professional' ? 'success' :
                                                                    club.Status === 'Semi-Professional' ? 'primary' :
                                                                    'warning'
                                                                }
                                                                className="text-[10px] px-2 py-0.5"
                                                            >
                                                                {club.Status}
                                                            </Chip>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="text-right flex-shrink-0">
                                                <div className="text-xs text-blue-500 font-mono font-semibold">
                                                    ID: {club['Unique ID']}
                                                </div>
                                                {club.Balance && (
                                                    <div className="text-xs text-green-500 mt-1 font-semibold">
                                                        €{parseInt(club.Balance).toLocaleString()}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </button>
                                    );
                                })}
                            </div>
                        )}

                        {/* No Results Message */}
                        {showDropdown && searchTerm.length >= 2 && searchResults.length === 0 && !loading && (
                            <div 
                                ref={dropdownRef}
                                className="absolute z-50 w-full mt-2 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl p-4 text-center"
                            >
                                <p className="text-zinc-500 text-sm">No clubs found</p>
                            </div>
                        )}
                    </div>
                    
                    {/* Helper text */}
                    {!value && (
                        <p className="text-xs text-zinc-500 mt-1.5">
                            Type club name to search or enter ID directly
                        </p>
                    )}
                </div>
            );
        };

        // ==========================================

If information is missing in the user text, invent realistic values that stay consistent (e.g., a high reputation club should have high facilities) but also use your imagination a little.

FIELD DEFINITIONS & CONSTRAINTS:

"crestStyle": "classic-shield", "primaryColor": "#DA291C", "secondaryColor": "#FBE122"

                    let text = await response.text();

            const updateRData = (key, val) => setRData(p => ({ ...p, [key]: val }));

            const getRegenCommand = () => {

                const skin = rData.skinToneRandom ? "" : rData.skinTone;

                return `"DETAILED_FUTURE_REGEN" "${rData.firstName}" "${rData.commonName}" "${rData.lastName}" "${dob}" "${nation}" "${rData.favTeam}" "${rData.ethnicity}" "${skin}" "${rData.hairColour}" "${rData.height}" "${rData.weight}" "${rData.foot}" "${rData.position}" "" "${rData.birthCity}" "${rData.ca}" "${pa}" "${rData.clubId}" "${rData.gender}"`;
            };

            const downloadRegen = () => {
                const fname = rData.firstName || "regen";
                const content = `# FM26 Regen\r\n${getRegenCommand()}`;
                const blob = new Blob([content], {type: "text/plain"});

                link.download = `${fname}_regen.edt`;
                link.click();
            };

            const downloadRegenZip = async () => {
                setZipLoading(true);
                try {
                    const zip = new window.JSZip();
                    const fname = rData.firstName || "regen";
                    const safeName = fname.toLowerCase().replace(/[^a-z0-9]/g, '_');
                    
                    // Add .edt file
                    const content = `# FM26 Regen\r\n${getRegenCommand()}`;
                    zip.file(`${safeName}_regen.edt`, content);
                    
                    // Add face image if available
                    if (faceCloudflareUrl || faceUrl) {
                        try {
                            const imageUrl = faceCloudflareUrl || faceUrl;
                            const response = await fetch(imageUrl);
                            if (response.ok) {
                                const faceBlob = await response.blob();
                                const imgFolder = zip.folder("graphics").folder(`regen_${safeName}`).folder("faces");
                                imgFolder.file(`${safeName}_face.png`, faceBlob);
                                
                                // Add config.xml for the face
                                const xml = `<record>\n\t<boolean id="preload" value="false"/>\n\t<boolean id="amap" value="false"/>\n\t<list id="maps">\n\t\t<record from="${safeName}_face" to="graphics/pictures/person/default/portrait"/>\n\t</list>\n</record>`;
                                imgFolder.file("config.xml", xml);
                            }

                            console.error('Failed to add face to ZIP:', err);
                        }
                    }
                    
                    // Add readme
                    zip.file("ReadMe.txt", `FM REGEN CREATOR - INSTALL GUIDE\n\n1. EDT: Put .edt file in C:\\XboxGames\\Football Manager 26 Console\\Content\\shared\\data\\database\\db\\2600\\edt\\permanent\n2. GRAPHICS: Put folder in [User]\\Documents\\Sports Interactive\\Football Manager 26 Console\\graphics\n\nNote: The .edt file contains the player creation command. Load it in your save to create the regen.`);
                    
                    const zipBlob = await zip.generateAsync({type: "blob"});
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(zipBlob);
                    link.download = `Regen_${safeName}.zip`;
                    link.click();

                    alert('ZIP Error: ' + e.message);

                setZipLoading(false);
            };

            const generateFace = async () => {

                setFaceLoading(true);
                
                // Calculate age from date of birth
                const birthYear = rData.dobRandom ? 2002 : parseInt(rData.dobInput.split('-')[0]);
                const age = 2026 - birthYear;
                
                // Map ethnicity codes to descriptive terms
                const ethnicityMap = {
                    '0': 'Northern European and Caucasian',
                    '1': 'Mediterranean and Southern European',
                    '2': 'North African and Middle Eastern',
                    '3': 'African and Sub-Saharan',
                    '4': 'South Asian and Indian subcontinent',
                    '5': 'Southeast Asian',
                    '9': 'Mixed ethnicity',
                    '10': 'East Asian',
                    '': 'diverse'
                };
                
                // Map hair color codes to descriptive terms
                const hairColorMap = {
                    '1': 'blonde hair',
                    '2': 'light brown hair',
                    '3': 'dark brown hair',
                    '4': 'red ginger hair',
                    '5': 'black hair',
                    '7': 'bald shaved head',
                    '': 'natural hair color'
                };
                
                const ethnicityDesc = ethnicityMap[rData.ethnicity] || 'diverse';
                const hairDesc = hairColorMap[rData.hairColour] || 'natural hair color';
                
                // Map skin tone to descriptive text based on ethnicity
                const skinToneDescriptions = {
                    '0': {
                        '1-5': 'Porcelain, cool rosy skin',
                        '6-10': 'Fair, ivory-toned skin',
                        '11-15': 'Light peach, sun-kissed skin',
                        '16-20': 'Tanned, bronzed skin'
                    },
                    '1': {
                        '1-5': 'Pale, creamy ivory skin',
                        '6-10': 'Light olive, warm beige skin',
                        '11-15': 'Deep olive, golden-tan skin',
                        '16-20': 'Rich bronze, sun-baked skin'
                    },
                    '2': {
                        '1-5': 'Fair, golden-ivory skin',
                        '6-10': 'Warm sand, olive-toned skin',
                        '11-15': 'Honey-bronze, amber skin',
                        '16-20': 'Rich terracotta, deep mocha skin'
                    },
                    '3': {
                        '1-5': 'Soft coffee, light cocoa skin',
                        '6-10': 'Warm walnut, caramel skin',
                        '11-15': 'Rich mahogany, deep brown skin',
                        '16-20': 'Deep ebony, obsidian skin'
                    },

                        '6-10': 'Golden-beige, honey skin',
                        '11-15': 'Rich almond, toasted nut skin',

                    },

                        '16-20': 'Rich sepia, deep tanned skin'
                    },
                    '10': {

                        '6-10': 'Warm peach, golden skin',
                        '11-15': 'Toasted honey, amber skin',
                        '16-20': 'Deep bronze, sun-darkened skin'
                    },
                    '9': {
                        '1-5': 'Neutral fair skin',
                        '6-10': 'Light-medium beige skin',
                        '11-15': 'Warm tan, caramel skin',
                        '16-20': 'Rich, deep brown skin'
                    },
                    '': {
                        '1-5': 'Neutral fair skin',
                        '6-10': 'Light-medium beige skin',
                        '11-15': 'Warm tan, caramel skin',
                        '16-20': 'Rich, deep brown skin'
                    }
                };

                const skinTone = parseInt(rData.skinTone);
                const ethnicity = rData.ethnicity || '';
                let skinDesc;
                
                if (skinTone >= 1 && skinTone <= 5) {
                    skinDesc = (skinToneDescriptions[ethnicity] || skinToneDescriptions[''])['1-5'];
                } else if (skinTone >= 6 && skinTone <= 10) {
                    skinDesc = (skinToneDescriptions[ethnicity] || skinToneDescriptions[''])['6-10'];
                } else if (skinTone >= 11 && skinTone <= 15) {
                    skinDesc = (skinToneDescriptions[ethnicity] || skinToneDescriptions[''])['11-15'];

                    skinDesc = (skinToneDescriptions[ethnicity] || skinToneDescriptions[''])['16-20'];
                }
                
                // Get nationality name from nation ID
                const nationality = rData.nationRandom ? 'international' : (nationsData.find(n => n.id === rData.nation)?.name || 'international');
                
                // Include haircut in prompt if selected
                const haircutDesc = rData.haircut ? `, ${rData.haircut}` : '';
                
                // Build detailed prompt
                const desc = `A hyper-realistic, medium-shot studio portrait of a ${age} years old, professional ${rData.gender.toLowerCase()} soccer player of ${ethnicityDesc} descent from ${nationality} with ${skinDesc} looking directly at the camera. ${hairDesc}${haircutDesc}. Wearing a soccer jersey with realistic fabric texture, mesh details, and subtle stitching. The lighting is professional cinematic studio lighting: a soft key light from the front-left to define facial features, and a cool rim light backlighting the hair to separate them from the background. The skin texture is imperfect and highly detailed: visible pores, slight skin tone variations, minute stubble or peach fuzz, and natural subsurface scattering. No plastic smoothness. Expression is focused and neutral-positive. The background is a plain, solid neutral grey, out of focus. Shot on a Sony A7R IV, 85mm portrait lens, f/1.8, sharp focus on the eyes, 8k resolution, raw photo quality, Fujifilm color science.`;
                
                const negativePrompt = '3d render, cgi, cartoon, anime, illustration, painting, drawing, plastic skin, wax doll, smooth skin, low quality, blurry, distorted, bad anatomy, deformed, ugly, cross-eyed, strabismus, squinting, lazy eye, asymmetric eyes, malformed pupils, zombie, dead eyes, watermark, text, signature';
                
                try {
                    const randomSeed = Math.floor(Math.random() * 2147483647);
                    const proxyUrl = `${PROXY_URL}/api?prompt=${encodeURIComponent(desc)}&negative_prompt=${encodeURIComponent(negativePrompt)}&model=${rData.aiModel}&width=2048&height=2048&nologo=true&safe=false&quality=hd&seed=${randomSeed}`;
                    
                    const response = await fetch(proxyUrl, {

                    if(!response.ok) throw new Error('Failed to generate face image');
                    
                    const blob = await response.blob();

                    const zip = new window.JSZip();
                    const tempId = `newgen_${Date.now()}`;
                    const imgFolder = zip.folder("graphics").folder("newgens").folder("faces");
                    imgFolder.file(`${tempId}.png`, blob);
                    
                    // Add config.xml
                    const xml = `<record>\n\t<boolean id="preload" value="false"/>\n\t<boolean id="amap" value="false"/>\n\t<list id="maps">\n\t\t<record from="${tempId}" to="graphics/pictures/person/default/portrait"/>\n\t</list>\n</record>`;
                    imgFolder.file("config.xml", xml);
                    
                    // Add readme
                    zip.file("ReadMe.txt", `FM26 PORTRAIT PACK\n\nInstallation:\n1. Extract the graphics folder to your Documents\\Sports Interactive\\Football Manager 26 Console\\ directory\n2. The portrait will be available in-game for newgens\n3. Reload graphics cache in FM26 if needed (Preferences > Advanced > Reload Skin)`);
                    
                    // Generate and download ZIP
                    const zipBlob = await zip.generateAsync({type: "blob"});
                    const url = URL.createObjectURL(zipBlob);
                    const filename = `Portrait_${tempId}.zip`;
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (err) {
                    alert('Download failed: ' + err.message);
                }

            // Get ethnicity-aware skin color for preview
            const getSkinColor = () => {
                const skinTone = parseInt(rData.skinTone);
                const ethnicity = rData.ethnicity || '';
                
                // Define ethnicity-specific color ranges (hue, saturation, base lightness)
                const ethnicityColors = {
                    '0': { // Northern European - cool rosy tones
                        hue: 15,
                        satRange: [25, 35, 30, 25],  // sat for each range
                        lightRange: [92, 85, 75, 60] // lightness for each range
                    },
                    '1': { // Mediterranean - olive/warm beige
                        hue: 30,
                        satRange: [30, 40, 45, 50],
                        lightRange: [90, 80, 65, 50]
                    },
                    '2': { // Middle Eastern/North African - golden/amber
                        hue: 35,
                        satRange: [35, 45, 50, 50],
                        lightRange: [88, 75, 58, 42]
                    },
                    '3': { // African - deep brown
                        hue: 25,
                        satRange: [35, 40, 35, 30],
                        lightRange: [70, 55, 35, 20]
                    },
                    '4': { // South Asian - warm wheat/almond
                        hue: 32,
                        satRange: [30, 38, 42, 40],
                        lightRange: [85, 72, 55, 38]
                    },
                    '5': { // Southeast Asian - golden/ochre
                        hue: 35,
                        satRange: [35, 45, 48, 45],
                        lightRange: [88, 75, 60, 45]
                    },
                    '10': { // East Asian - peachy/golden
                        hue: 28,
                        satRange: [28, 38, 42, 40],
                        lightRange: [90, 78, 62, 48]
                    },
                    '9': { // Mixed - neutral
                        hue: 28,
                        satRange: [30, 35, 38, 35],
                        lightRange: [88, 75, 58, 40]
                    },
                    '': { // Random/Default - neutral
                        hue: 28,
                        satRange: [30, 35, 38, 35],
                        lightRange: [88, 75, 58, 40]
                    }
                };

                const colorData = ethnicityColors[ethnicity] || ethnicityColors[''];
                let rangeIndex,sat, light;
                
                if (skinTone >= 1 && skinTone <= 5) {
                    rangeIndex = 0;
                    // Interpolate within range
                    const progress = (skinTone - 1) / 4;
                    sat = colorData.satRange[0];
                    light = colorData.lightRange[0] - (progress * (colorData.lightRange[0] - colorData.lightRange[1]) / 2);
                } else if (skinTone >= 6 && skinTone <= 10) {
                    rangeIndex = 1;
                    const progress = (skinTone - 6) / 4;
                    sat = colorData.satRange[1];
                    light = colorData.lightRange[1] - (progress * (colorData.lightRange[1] - colorData.lightRange[2]) / 2);
                } else if (skinTone >= 11 && skinTone <= 15) {
                    rangeIndex = 2;
                    const progress = (skinTone - 11) / 4;
                    sat = colorData.satRange[2];
                    light = colorData.lightRange[2] - (progress * (colorData.lightRange[2] - colorData.lightRange[3]) / 2);
                } else {
                    rangeIndex = 3;
                    const progress = (skinTone - 16) / 4;
                    sat = colorData.satRange[3];
                    light = colorData.lightRange[3] - (progress * 5); // Darken further
                }

                return `hsl(${colorData.hue}, ${sat}%, ${light}%)`;

                    let query = `${SUPABASE_URL}/rest/v1/clubs?select=Unique ID`;

                    let nationsToFilter = [...filters.nations];
                    if (filters.continents.length > 0) {

                        query += `&Nation=in.(${nationsToFilter.map(n => encodeURIComponent(n)).join(',')})`;
                    }

                    if (filters.minRep !== '') {

                        query += `&Rep=lte.${filters.maxRep}`;

                    // Apply balance filters
                    if (filters.minBalance !== '') {

                        query += `&Balance=lte.${filters.maxBalance}`;

                    if (filters.minTF !== '') {
                        query += `&TF=gte.${filters.minTF}`;

                        query += `&TF=lte.${filters.maxTF}`;

                        query += `&YF=gte.${filters.minYF}`;
                    }
                    if (filters.maxYF !== '') {
                        query += `&YF=lte.${filters.maxYF}`;
                    }

                        headers: {

                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }

                        return;

                    const lines = clubs.map(club => `"RETAIN_PLAYERS" "${club['Unique ID']}"`);

                        const blob = new Blob([content], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'retain_players.ddt';
                        a.click();
                        URL.revokeObjectURL(url);
                        setResultMessage(`✅ File created successfully with ${clubs.length} clubs!`);
